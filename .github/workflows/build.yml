name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build dylib
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang -arch arm64 -arch arm64e -miphoneos-version-min=14.0 -dynamiclib -fobjc-arc -framework Foundation -isysroot "$SDK" -o KGVip.dylib KGVip.m
          lipo -info KGVip.dylib
          ls -la KGVip.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: KGVip
          path: KGVip.dylib
