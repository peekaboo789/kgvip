name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject credentials
        env:
          KG_TOKEN: ${{ secrets.KG_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          p = 'KGVip.m'
          s = open(p, encoding='utf-8').read()
          token = os.environ.get('KG_TOKEN', '')
          if not token:
              raise SystemExit('KG_TOKEN secret missing')
          s = s.replace('__KG_TOKEN__', token)
          open(p, 'w', encoding='utf-8').write(s)
          assert token in open(p, encoding='utf-8').read()
          PY
      - name: Install iOS toolchain
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld make git curl unzip
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          ls "$RUNNER_TEMP/sdks" | head -20
      - name: Build dylib
        run: |
          set -o pipefail
          SDK=$(ls -d "$RUNNER_TEMP"/sdks/iPhoneOS*.sdk | sort -V | tail -1)
          echo "using $SDK" | tee build.log
          LD64=$(which ld64.lld || ls /usr/bin/ld64.lld* | head -1)
          echo "linker $LD64" | tee -a build.log
          clang -target arm64-apple-ios14.0 -isysroot "$SDK" \
            -fobjc-arc -dynamiclib -O2 \
            -fuse-ld="$LD64" \
            -framework Foundation -framework CoreFoundation \
            -o KGVip.dylib KGVip.m 2>&1 | tee -a build.log
          file KGVip.dylib | tee -a build.log
          ls -la KGVip.dylib | tee -a build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buildlog
          path: build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: KGVip
          path: KGVip.dylib
